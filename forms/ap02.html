<h1 class="title" style="margin-bottom:3mm">แบบเสนอโครงการวิจัยเพื่อพิจารณา</h1>

<h2 class="n">1. ชื่อโครงการวิจัย (Title)</h2>
<table class="g box"><tr><td>(ชื่อภาษาไทย) <span data-f="meta.title_th"></span></td></tr><tr><td>(ชื่อภาษาอังกฤษ) <span data-f="meta.title_en"></span></td></tr></table>

<h2 class="n">2. สาขาวิชาที่ทำการวิจัย</h2>
<p class="hint">ระบุสาขา เช่น แพทยศาสตร์ (ระบุสาขาย่อย) ทันตแพทยศาสตร์ สาธารณสุขศาสตร์ เภสัชศาสตร์ พยาบาลศาสตร์ สหเวชศาสตร์ เทคนิคการแพทย์ สังคมศาสตร์ เป็นต้น</p>
<p class="body"><span data-f="methodology.research_field"></span></p>

<h2 class="n">3. ผู้วิจัย ผู้วิจัยร่วม และที่ปรึกษา</h2>
<div class="tw"><table class="g">
  <colgroup><col style="width:8%"><col style="width:26%"><col style="width:30%"><col></colgroup>
  <tr class="hs"><td colspan="4">3.1 ผู้วิจัยหลัก หรือ หัวหน้าโครงการวิจัย (Principal Investigator)</td></tr>
  <tr><td colspan="2" class="lab">ตำแหน่งวิชาการ-ยศ-ชื่อ-สกุล</td><td colspan="2"><span data-f="principal_investigator.title_th"></span></td></tr>
  <tr><td colspan="2" class="lab">สาขาวิชาและหน่วยงาน</td><td colspan="2"><span data-f="principal_investigator.affiliation"></span><span data-if="principal_investigator.student_year"> ชั้นปี <span data-f="principal_investigator.student_year"></span></span></td></tr>
  <tr><td colspan="2" class="lab">ที่อยู่ (ที่ทำงาน)</td><td colspan="2"><span data-f="principal_investigator.address"></span></td></tr>
  <tr><td colspan="2" class="lab">เบอร์โทรศัพท์</td><td colspan="2"><span data-f="principal_investigator.phone" class="nobreak"></span></td></tr>
  <tr><td colspan="2" class="lab">อีเมล</td><td colspan="2"><span data-f="principal_investigator.email" data-fmt="email" class="nobreak"></span></td></tr>
  <tr class="hs"><td colspan="4">3.2 ผู้วิจัยร่วม (Co-Investigators) (นักศึกษา ให้ระบุชั้นปี)</td></tr>
  <tr class="hs"><td class="c">ลำดับ</td><td>ตำแหน่งวิชาการ-ยศ-ชื่อ-สกุล</td><td>สาขาวิชาและหน่วยงาน</td><td>เบอร์โทร / อีเมล</td></tr>
  <tbody data-each="co_investigators" data-min="3"><template>
    <tr><td class="c" data-i></td><td><span data-f=".title_th"></span></td><td><span data-f=".affiliation"></span></td><td><span data-f=".phone" class="nobreak"></span><br><span data-f=".email" data-fmt="email" class="nobreak"></span></td></tr>
  </template></tbody>
  <tr class="hs"><td colspan="4">3. ที่ปรึกษาโครงการวิจัย (Research Advisor)</td></tr>
  <tr class="hs"><td class="c">ลำดับ</td><td>ตำแหน่งวิชาการ-ยศ-ชื่อ-สกุล</td><td>สาขาวิชาและหน่วยงาน</td><td>เบอร์โทร / อีเมล</td></tr>
  <tbody data-each="advisors" data-min="2"><template>
    <tr><td class="c" data-i></td><td><span data-f=".title_th"></span></td><td><span data-f=".affiliation"></span></td><td><span data-f=".phone" class="nobreak"></span><br><span data-f=".email" data-fmt="email" class="nobreak"></span></td></tr>
  </template></tbody>
  <tr class="hs"><td colspan="4">4. ผู้ประสานงานโครงการวิจัย (Research Coordinator)</td></tr>
  <tr><td colspan="2" class="lab">ตำแหน่งวิชาการ-ยศ-ชื่อ-สกุล</td><td colspan="2"><span data-f="coordinator.title_th"></span></td></tr>
  <tr><td colspan="2" class="lab">เบอร์โทรศัพท์</td><td colspan="2"><span data-f="coordinator.phone" class="nobreak"></span></td></tr>
  <tr><td colspan="2" class="lab">อีเมล</td><td colspan="2"><span data-f="coordinator.email" data-fmt="email" class="nobreak"></span></td></tr>
</table></div>

<h2 class="n">4. ช่วงเวลาที่ทำการวิจัย</h2>
<table class="g"><colgroup><col style="width:52%"><col></colgroup>
  <tr><td class="lab">เดือน/ปี ที่จะเริ่มเก็บข้อมูลในผู้เข้าร่วมการวิจัย</td><td>เดือน <span data-f="meta.start_date" data-fmt="monthyear"></span></td></tr>
  <tr><td class="lab">ระยะเวลาที่จะเก็บข้อมูลในผู้เข้าร่วมการวิจัย</td><td><span data-f="meta.duration_months"></span> เดือน</td></tr>
  <tr><td class="lab">เดือน/ปี ที่คาดว่าจะสิ้นสุดการวิจัย</td><td>เดือน <span data-f="meta.end_date" data-fmt="monthyear"></span></td></tr>
</table>

<h2 class="n">5. สถานที่ทำการวิจัย</h2>
<p class="hint">ทำการวิจัยที่สถาบันเดียวหรือสหสถาบัน (multicentre) ระบุห้อง ตึก อาคาร</p>
<p class="body"><span data-f="meta.sites"></span><span data-if="meta.is_multicenter"> (สหสถาบัน: <span data-f="meta.multicenter_institutions"></span>)</span></p>

<h2 class="n">6. ความสำคัญของปัญหาที่จะทำการวิจัย</h2>
<p class="hint">สรุปความสำคัญและขนาดของปัญหา เหตุผล (rationale) และช่องว่างความรู้ (gap of knowledge)</p>
<p class="body para"><span data-f="methodology.rationale" class="blk"></span></p>

<h2 class="n">7. วัตถุประสงค์ของการวิจัย</h2>
<table class="g"><colgroup><col style="width:30%"><col></colgroup>
  <tr><td class="lab">7.1 วัตถุประสงค์หลัก</td><td><span data-f="methodology.primary_objective"></span></td></tr>
  <tr><td class="lab">7.2 วัตถุประสงค์รอง</td><td><span data-f="methodology.secondary_objectives" data-fmt="list"></span></td></tr>
</table>

<h2 class="n">8. ประโยชน์ที่จะได้จากการวิจัย</h2>
<p class="hint">อธิบายว่า ผลการวิจัยจะสามารถนำไปใช้ในการแก้ปัญหาหรือมีประโยชน์อย่างไร</p>
<p class="body para"><span data-f="methodology.expected_benefits" class="blk"></span></p>

<h2 class="n">9. การรวบรวมรายงานที่เกี่ยวข้องกับการวิจัยที่จะกระทำ</h2>
<p class="hint">เคยมีรายงานการวิจัยลักษณะนี้มาก่อนหรือไม่ ผลเป็นอย่างไร (อ้างอิงแบบ Vancouver หรือ APA); ถ้าเป็นยา สมุนไพร ผลิตภัณฑ์ธรรมชาติ เครื่องสำอาง อาหารเสริม หรือเครื่องมือแพทย์ ให้เน้นทบทวนด้านความปลอดภัย ผลข้างเคียง หรือเหตุการณ์ไม่พึงประสงค์</p>
<p class="body para"><span data-f="methodology.literature_review" class="blk"></span></p>

<h2 class="n">10. รูปแบบการวิจัย</h2>
<p class="hint">ระบุรูปแบบ Study design ที่สามารถตอบคำถามการวิจัยได้</p>
<p class="body"><span data-f="methodology.study_design" class="blk"></span></p>

<h2 class="n">11. ลักษณะตัวอย่างหรือประชากรที่ทำการศึกษา</h2>
<table class="g"><colgroup><col style="width:34%"><col style="width:9%"><col></colgroup>
  <tr><td class="lab">11.1 ประชากรเป้าหมาย</td><td colspan="2"><span data-f="methodology.target_population"></span></td></tr>
  <tr><td class="lab">11.2 ขนาดตัวอย่าง จำนวนผู้เข้าร่วมการวิจัยที่ต้องการกี่คน</td><td colspan="2"><span data-f="methodology.sample_size"></span> คน<br><span data-f="methodology.sample_size_calculation"></span></td></tr>
  <tr><td class="lab" rowspan="5">11.3 วิธีการเข้าถึงและสรรหาผู้เข้าร่วมการวิจัย (Recruitment Process)</td>
      <td class="c"><span data-c="ap02.recruit.direct"></span></td><td>เชิญชวนโดยตรง อธิบายรายละเอียด <span data-f="methodology.recruitment_process"></span></td></tr>
  <tr><td class="c"><span data-c="ap02.recruit.online"></span></td><td>ผ่านสื่อสังคมออนไลน์หรือแอปพลิเคชั่น (ส่งข้อความให้คณะกรรมการพิจารณา)</td></tr>
  <tr><td class="c"><span data-c="ap02.recruit.clinician"></span></td><td>ขอความร่วมมือผ่านแพทย์/พยาบาล</td></tr>
  <tr><td class="c"><span data-c="ap02.recruit.poster"></span></td><td>แผ่นป้ายประชาสัมพันธ์ (ระบุสถานที่ติดแผ่นป้าย และส่งแผ่นป้ายให้คณะกรรมการพิจารณา)</td></tr>
  <tr><td class="c"><span data-c="ap02.recruit.other"></span></td><td>อื่นๆ อธิบายรายละเอียด <span data-f="ap02.recruit.other" data-if="ap02.recruit.other"></span></td></tr>
  <tr><td class="lab">11.4 เกณฑ์การคัดเข้าร่วมการวิจัย (Inclusion criteria)</td><td colspan="2"><span data-f="methodology.inclusion_criteria" data-fmt="list"></span></td></tr>
  <tr><td class="lab">11.5 เกณฑ์การคัดออกจากการวิจัย (Exclusion criteria)</td><td colspan="2"><span data-f="methodology.exclusion_criteria" data-fmt="list"></span></td></tr>

  <tr><td class="lab">11.7 เกณฑ์การยุติการวิจัยก่อนกำหนด (Early termination criteria)</td><td colspan="2"><span data-f="methodology.early_termination_criteria" data-fmt="list"></span></td></tr>
</table>

<h2 class="n">12. ระเบียบวิธีวิจัย</h2>
<h3 class="n">12.1 การดำเนินการวิจัย</h3>
<p class="body">12.1.1 การดำเนินการวิจัยโดยละเอียด <span class="hint inl">(แนบ Flow chart หรือรูปประกอบ)</span></p>
<p class="body para"><span data-f="methodology.procedures" class="blk"></span></p>
<p class="body">12.1.2 การแบ่งกลุ่มและการดำเนินการวิจัยในแต่ละกลุ่ม: <span data-f="ap02.grouping"></span></p>
<div data-if="classification.has_placebo"><p class="body">12.1.3 การใช้ยาหลอก (placebo / control): เหตุผลความจำเป็นและแนวทางป้องกันอันตรายในกลุ่มที่ได้รับยาหลอก</p><p class="body para"><span data-f="ap02.placebo_rationale" class="blk"></span></p></div>
<div data-if="classification.has_future_biobank"><p class="body">12.1.4 การเก็บตัวอย่างชีวภาพเพื่อใช้ในอนาคต: สถานที่เก็บ ระยะเวลาจัดเก็บ และการขอความยินยอมล่วงหน้า (แนบ AP 03_2/2026)</p><p class="body para"><span data-f="ap02.biobank_plan" class="blk"></span></p></div>
<div data-if="risks.audio_video_recording"><p class="body">12.1.5 การถ่ายภาพหรือบันทึกเสียง: วิธีรักษาความลับของข้อมูลผู้เข้าร่วมการวิจัย</p><p class="body para"><span data-f="ap02.recording_protection" class="blk"></span></p></div>
<p class="body">12.1.6 เมื่องานวิจัยเสร็จสิ้น มีการดำเนินการอย่างไรกับผู้เข้าร่วมการวิจัย: <span data-f="benefits.post_trial_care"></span></p>

<h3 class="n">12.2 งานวิจัยที่เป็นเรื่องเฉพาะ</h3>
<p class="hint">หัวข้อที่ตอบ "ไม่ใช่" แสดงเพียงบรรทัดเดียวตามแบบฟอร์ม (ตัดรายละเอียดออก) หัวข้อที่ตอบ "ใช่" ต้องตอบรายละเอียดให้ครบ</p>
<table class="g cat"><colgroup><col><col style="width:12%"><col style="width:14%"></colgroup>
  <tr><td>A. งานวิจัยเกี่ยวกับยา (Investigational Drug)</td><td class="yn"><span data-yn="classification.has_drug" data-v="1"></span> ใช่</td><td class="yn"><span data-yn="classification.has_drug" data-v="0"></span> ไม่ใช่</td></tr>
  <tr data-if="classification.has_drug"><td colspan="3" class="indent">ชื่อยา (ทุกชนิดที่ใช้) <span data-f="classification.drug_names"></span><br>
    <span data-c="ap02.drug.unapproved"></span> ยายังไม่ได้รับการรับรองจาก อย. &nbsp; <span data-c="ap02.drug.standard"></span> ขึ้นทะเบียน อย.แล้ว ใช้ในขนาดยามาตรฐานและข้อบ่งชี้ที่ได้รับการรับรอง<br>
    <span data-c="ap02.drug.nonstandard_dose"></span> ขึ้นทะเบียน อย. แล้ว แต่ขนาดยาไม่ใช่ขนาดมาตรฐาน &nbsp; <span data-c="ap02.drug.off_label"></span> ขึ้นทะเบียน อย. แล้ว แต่ใช้ในข้อบ่งชี้ต่างจากที่ได้รับการรับรอง</td></tr>

  <tr><td>B. งานวิจัยที่มีการตรวจวินิจฉัยหรือทำหัตถการ นอกเหนือจากการปฏิบัติทางคลินิกปกติ</td><td class="yn"><span data-yn="classification.has_procedure" data-v="1"></span> ใช่</td><td class="yn"><span data-yn="classification.has_procedure" data-v="0"></span> ไม่ใช่</td></tr>
  <tr data-if="classification.has_procedure"><td colspan="3" class="indent">
    <span data-c="ap02.proc.specimen"></span> การเจาะเลือดหรือเก็บตัวอย่างชีวภาพ ระบุ <span data-f="ap02.proc.specimen" data-if="ap02.proc.specimen"></span><br>
    <span data-c="ap02.proc.ct"></span> การตรวจเอกซเรย์คอมพิวเตอร์ &nbsp; <span data-c="ap02.proc.high_dose"></span> การตรวจที่ได้รับปริมาณรังสีสูงเพิ่มเติมจากปกติ &nbsp; <span data-c="ap02.proc.radiation"></span> การฉายรังสีเพิ่มเติมจากปกติ<br>
    <span data-c="ap02.proc.anesthesia"></span> การดมยาสลบ/การผ่าตัด เพิ่มเติมจากปกติ &nbsp; <span data-c="ap02.proc.other"></span> อื่นๆ เพิ่มเติมจากปกติ<br>รายละเอียด <span data-f="classification.procedure_detail"></span></td></tr>

  <tr><td>C. งานวิจัยเกี่ยวกับอาหาร: ผลิตภัณฑ์อาหาร</td><td class="yn"><span data-yn="classification.has_food_product" data-v="1"></span> ใช่</td><td class="yn"><span data-yn="classification.has_food_product" data-v="0"></span> ไม่ใช่</td></tr>
  <tbody data-if="classification.has_food_product">
    <tr><td colspan="3" class="indent">คุณลักษณะเฉพาะ (สูตรส่วนประกอบ ที่มาของวัตถุดิบ และรูปแบบ): <span data-f="classification.food_detail"></span></td></tr>
    <tr><td colspan="3" class="indent">กระบวนการเตรียม ขั้นตอนการผลิต: <span data-f="ap02.food.preparation"></span></td></tr>
    <tr><td colspan="3" class="indent">วิธีการบริโภคและวิธีการเก็บรักษา: <span data-f="ap02.food.consumption"></span></td></tr>

<h2 class="n">15. เพิ่มเติมข้อพิจารณาในเรื่องชุมชน (ในกรณีที่ทำการวิจัยในชุมชน)</h2>

<p class="body">15.1 การปรึกษาหารือกับผู้นำชุมชน ก่อนเริ่มการวิจัย: <span data-f="ap02.community.consultation"></span></p>
