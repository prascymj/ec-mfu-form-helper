<!-- คำรับรอง (TH) -->
<section class="newpage keep">
  <h1 class="title" style="margin-bottom:3mm">คำรับรองของผู้วิจัยหลัก</h1>
  <p>ข้าพเจ้า <span data-f="principal_investigator.title_th" style="text-decoration:underline"></span> &nbsp;สำนักวิชา/สังกัด <span data-f="principal_investigator.affiliation" style="text-decoration:underline"></span></p>
  <p style="text-indent:10mm">ขอให้คำรับรองต่อคณะกรรมการจริยธรรมการวิจัย มหาวิทยาลัยแม่ฟ้าหลวง (คณะกรรมการ) ว่า</p>
  <ol class="aff">
    <li>ข้าพเจ้าจะเริ่มดำเนินการวิจัย ภายหลังจากได้รับหนังสือรับรองด้านจริยธรรมการวิจัย หรือ หนังสือยกเว้นการพิจารณาด้านจริยธรรมการวิจัย จากคณะกรรมการ เท่านั้น</li>
    <li>ข้าพเจ้าได้ตรวจสอบความถูกต้องครบถ้วนของข้อมูลในโครงการวิจัยและเอกสารทั้งหมดที่นำเสนอต่อคณะกรรมการ</li>
    <li>ในกรณีที่ผลการพิจารณาโครงการวิจัย คือ "ปรับปรุงแก้ไขเล็กน้อย" หรือ "ปรับปรุงแก้ไขและนำเข้าพิจารณาใหม่" ข้าพเจ้าจะดำเนินการแก้ไขตามคำแนะนำ และส่งกลับมาเพื่อให้คณะกรรมการพิจารณา <u>ภายใน 60 วันปฏิทิน</u> นับจากวันที่ได้รับการแจ้งผล (กรณีที่ส่งกลับล่าช้าหลังจาก 60 วันปฏิทิน นับจากวันที่ได้รับการแจ้งผล ผู้วิจัยจะต้องส่งโครงการเข้ามารับการพิจารณาใหม่ทั้งหมด เช่นเดียวกับการส่งโครงการครั้งแรก รวมทั้งต้องจ่ายค่าธรรมเนียมซ้ำ)</li>
    <li>เมื่อโครงการวิจัยได้รับการรับรองจากคณะกรรมการ ข้าพเจ้าจะปฏิบัติดังต่อไปนี้
      <ol>
        <li>ดำเนินการวิจัยตามที่ระบุในโครงการวิจัยอย่างเคร่งครัด</li>
        <li>ใช้เอกสารข้อมูลและขอความยินยอมเข้าร่วมการวิจัย แบบสอบถาม แบบบันทึกข้อมูล และเอกสารประชาสัมพันธ์ ที่มีตราประทับหรือได้รับการรับรองจากคณะกรรมการ เท่านั้น</li>
        <li>ส่งรายงานความก้าวหน้าของการวิจัย (AP 05/2026) ตามระยะเวลาที่คณะกรรมการกำหนดและภายใน 30 วัน ก่อนหมดอายุการรับรอง รวมทั้งส่งหนังสือขอต่ออายุการรับรอง ในกรณีที่การวิจัยยังไม่เสร็จสิ้น</li>
        <li>ส่งรายงานส่วนแก้ไขเพิ่มเติมโครงการวิจัย (AP 06/2026) และโครงการวิจัยฉบับแก้ไข เมื่อมีการแก้ไขเพิ่มเติมโครงการวิจัย เพื่อแจ้งให้คณะกรรมการพิจารณารับรองก่อนดำเนินการตามที่ได้แก้ไขเพิ่มเติม (ยกเว้นในกรณีที่การแก้ไขเพิ่มเติมนั้นกระทำเพื่อความปลอดภัยของผู้เข้าร่วมการวิจัย)</li>
        <li>ส่งรายงานเหตุการณ์ไม่พึงประสงค์ชนิดร้ายแรง (AP 07/2026) เมื่อมีเหตุการณ์ไม่พึงประสงค์ชนิดร้ายแรง</li>
        <li>ส่งรายงานการการเบี่ยงเบนหรือไม่ปฏิบัติตามข้อกำหนด (AP 08/2026) เมื่อมีการเบี่ยงเบน หรือ ไม่ปฏิบัติตามโครงการวิจัยที่ได้รับการรับรอง</li>
        <li>ส่งรายงานปิดโครงการวิจัย (AP 09/2026) เมื่อการวิจัยเสร็จสิ้น</li>
      </ol>
    </li>
  </ol>

    <li><span class="cb"></span> โครงการวิจัยที่ได้รับทุนจากบริษัทเอกชน ซึ่งแสวงหาผลกำไรทั้งภายในหรือภายนอกประเทศ หรือทุนจากหน่วยงานต่างประเทศ 7,000 บาท ต่อโครงการ</li>
    <li><span class="cb"></span> โครงการวิจัยที่ได้รับทุนจากมหาวิทยาลัยแม่ฟ้าหลวง หรือโครงการที่ไม่ได้รับทุนจากที่ใด และดำเนินการโดย พนักงานสายวิชาการ 1,500 บาทต่อโครงการ</li>
    <li><span class="cb"></span> โครงการวิจัยที่ได้รับทุนจากมหาวิทยาลัยแม่ฟ้าหลวง หรือโครงการที่ไม่ได้รับทุนจากที่ใด และดำเนินการโดย นักศึกษาปริญญาโท หรือปริญญาเอก 500 บาทต่อโครงการ</li>
    <li><span class="cb"></span> โครงการวิจัยที่ได้รับทุนจากมหาวิทยาลัยแม่ฟ้าหลวง หรือโครงการที่ไม่ได้รับทุนจากที่ใด และดำเนินการโดย นักศึกษาปริญญาตรี ได้รับการยกเว้นค่าธรรมเนียม</li>
    <li><span class="cb"></span> โครงการวิจัยที่มีการดำเนินงานในหลายสถาบันภายใต้ข้อตกลงการร่วมมือด้านการวิจัย ร่วมกับคณะกรรมการกลางพิจารณาจริยธรรมการวิจัยในคน (CREC) 1,500 บาทต่อโครงการ</li>
