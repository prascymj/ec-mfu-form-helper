<style>
@page { margin: 9mm 15mm 12mm 20mm; @top-left { content: none; } }
.sheet.fee { font-size: 14pt; line-height: 1.2; } /* the official FEE form is set in 14pt, not 16pt */
/* page 1 is one page by design (no page break inside it), so the tight Word-like spacing is safe */
.sheet.fee p { line-height: 1.22; }
.fee h1.title { margin: 0; }
.fee .sub { text-align: center; font-weight: 700; margin: 0 0 4mm; }
.fee .row { margin: 0 0 1mm; }
.fee .grid2 { display: grid; grid-template-columns: 0.46fr 0.54fr; column-gap: 4mm; margin: 1mm 0; }
.fee .boxhead { border: 1px solid #000; padding: 0 2mm; font-weight: 700; text-decoration: underline; margin: 2mm 0 0.5mm; }
.fee .opt { padding-left: 7mm; text-indent: -7mm; margin: 0 0 0.3mm; }
.fee .opt .cb { text-indent: 0; }

.fee .signs p { margin: 0; }
.fee .codes { display: flex; gap: 12mm; margin: 0 0 1mm; }
.fee .red { color: #e00000; }
.fee .evidence { border: 1px solid #000; height: 105mm; margin: 2mm 0 6mm; }
.fee .hl { background: #ffff00; font-weight: 700; }
.fee ol.notes { padding-left: 7mm; margin: 1mm 0 0; }
.fee ol.notes li { margin: 0 0 1mm; }
.fee ul.dash { list-style: none; padding-left: 8mm; margin: 0; }
.fee ul.dash li::before { content: "-"; display: inline-block; width: 6mm; margin-left: -6mm; }
.fee .pick { display: grid; grid-template-columns: auto 1fr; column-gap: 2mm; margin: 2mm 0 3mm 7mm; }

<p class="sub">การยื่นเสนอขอรับการพิจารณาจริยธรรมการวิจัยในมนุษย์ มหาวิทยาลัยแม่ฟ้าหลวง</p>

<p class="boxhead">ประเภทการพิจารณาโครงการวิจัยที่เสนอขอรับการพิจารณาครั้งแรก</p>
<p class="opt"><span data-c="_fee.option==A"></span> โครงการวิจัยที่ได้เสนอขอทุนจากหน่วยงานของรัฐ ภายในประเทศ หรือหน่วยงานเอกชนที่ไม่แสวงหาผลกำไร เก็บค่าธรรมเนียมการพิจารณาโครงการวิจัย จำนวน 3,500 บาทต่อโครงการ</p>
<p class="opt"><span data-c="_fee.option==B"></span> โครงการวิจัยที่ได้เสนอขอทุนจากหน่วยงานเอกชน ซึ่งแสวงหาผลกำไรทั้งภายในหรือภายนอกประเทศ หรือทุนจากหน่วยงานต่างประเทศ เก็บค่าธรรมเนียมการพิจารณาโครงการวิจัย จำนวน 7,000 บาท ต่อโครงการ</p>
<p class="opt"><span data-c="_fee.option==C"></span> โครงการวิจัยที่ได้เสนอขอทุนจากมหาวิทยาลัยแม่ฟ้าหลวง หรือโครงการที่ไม่ได้รับทุนจากที่ใด และดำเนินการโดยพนักงานสายวิชาการ เก็บค่าธรรมเนียมการพิจารณาโครงการวิจัย จำนวน 1,500 บาทต่อโครงการ</p>
<p class="opt"><span data-c="_fee.option==D"></span> โครงการวิจัยที่ได้เสนอขอทุนจากมหาวิทยาลัยแม่ฟ้าหลวง หรือโครงการที่ไม่ได้รับทุนจากที่ใด และดำเนินการโดยนักศึกษาระดับปริญญาโท หรือปริญญาเอก เก็บค่าธรรมเนียมการพิจารณาโครงการวิจัย จำนวน 500 บาทต่อโครงการ</p>
<p class="opt"><span data-c="_fee.option==E"></span> โครงการวิจัยที่ได้เสนอขอทุนจากมหาวิทยาลัยแม่ฟ้าหลวง หรือโครงการที่ไม่ได้รับทุนจากที่ใด และดำเนินการโดยนักศึกษาปริญญาตรี ได้รับการยกเว้นค่าธรรมเนียม</p>

<p class="opt"><span class="cb"></span> โครงการวิจัยที่ได้เสนอขอทุนจากหน่วยงานของรัฐ ภายในประเทศ หรือหน่วยงานเอกชนที่ไม่แสวงหาผลกำไร เก็บค่าธรรมเนียมการต่ออายุการรับรอง จำนวน 1,500 บาท ต่อโครงการ</p>

<p class="boxhead">ประเภทโครงการที่ต้องรับการพิจารณาอย่างต่อเนื่อง เก็บค่าธรรมเนียมการแก้ไขเพิ่มเติมโครงการวิจัยเป็นรายครั้ง</p>
